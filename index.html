<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Google</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  
</head>
<body class="bg-[#ffffff] min-h-screen flex flex-col relative">

  
  <header class="flex justify-end items-center gap-4 p-4 text-[14px]">
    <a href="#" class="hover:underline">Gmail</a>
    <a href="#" class="hover:underline">Images</a>

    <div class="relative">
    <button id="apps-btn" class="w-10 h-10 grid place-items-center rounded-full hover:bg-gray-100">
      <svg class="w-6 h-6 fill-[#5f6368]" viewBox="0 0 24 24"><path d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z"/></svg>
    </button>
     <div id="apps-menu" class="hidden absolute right-0 top-12 w-[340px] bg-[#f8f9fa] rounded-[28px] shadow-2xl overflow-hidden z-50">


    <div class="px-6 pt-5 pb-3 flex justify-between items-center">
    <h2 class="text-lg font-medium text-gray-800">
      Your favorites
    </h2>

    <button
      class="w-10 h-10 rounded-full hover:bg-gray-200 flex items-center justify-center text-gray-700 transition"
      title="Edit favorites"
      type="button"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
    </button>
  </div>

  <!-- Apps -->
  <div class="overflow-y-auto px-4 pb-4 max-h-[70vh]">
    <div class="grid grid-cols-3 gap-y-2 gap-x-1 text-center">

      <!-- Account -->
      <a href="#"
         class="flex flex-col items-center p-3 rounded-2xl hover:bg-gray-200/70 transition">
        <div class="w-12 h-12 rounded-full overflow-hidden mb-1 flex items-center justify-center">
          <img
            src="eyes.jpeg"
            class="w-9 h-9 rounded-full object-cover"
            alt="Profile"
          />
        </div>
        <span class="text-xs text-gray-700">Account</span>
      </a>

      <!-- Drive -->
      <a href="#"
         class="flex flex-col items-center p-3 rounded-2xl hover:bg-gray-200/70 transition">
        <div class="w-12 h-12 flex items-center justify-center mb-1">
          <svg class="w-9 h-9" viewBox="0 0 87.3 78.2">
            <path fill="#0066da"
              d="M6.6 66.85l3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.45l5.4 9.4z"/>
            <path fill="#00ac47"
              d="M43.65 25L29.9 1.2c-1.35.8-2.5 1.9-3.3 3.3l-24 41.55c-.8 1.35-1.2 2.9-1.2 4.45h27.5L43.65 25z"/>
            <path fill="#ea4335"
              d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l3.85-6.65 5.4-9.4c.8-1.35 1.2-2.9 1.2-4.45H59.8l13.75 23.8z"/>
            <path fill="#00832d"
              d="M43.65 25L57.4 48.8h27.5c0-1.55-.4-2.9-1.2-4.45L69.75 2.8c-.8-1.4-1.95-2.5-3.3-3.3L43.65 25z"/>
            <path fill="#ffba00"
              d="M59.8 48.8H27.5L13.75 72.6c1.35.8 2.9 1.2 4.45 1.2h50.9c1.55 0 3.1-.4 4.45-1.2L59.8 48.8z"/>
          </svg>
        </div>
        <span class="text-xs text-gray-700">Drive</span>
      </a>

      <!-- Gmail -->
      <a href="#"
         class="flex flex-col items-center p-3 rounded-2xl hover:bg-gray-200/70 transition">
        <div class="w-12 h-12 flex items-center justify-center mb-1">
          <svg class="w-10 h-10" viewBox="0 0 512 512">
            <path fill="#4285F4"
              d="M38.4 128v281.6c0 21.2 17.2 38.4 38.4 38.4h51.2V230.4L256 332.8l128-102.4v215.6h51.2c21.2 0 38.4-17.2 38.4-38.4V128L256 268.8z"/>
            <path fill="#C5221F"
              d="M38.4 128L256 268.8 473.6 128V89.6c0-21.2-17.2-38.4-38.4-38.4H76.8C55.6 51.2 38.4 68.4 38.4 89.6z"/>
          </svg>
        </div>
        <span class="text-xs text-gray-700">Gmail</span>
      </a>

      <!-- YouTube -->
      <a href="#"
         class="flex flex-col items-center p-3 rounded-2xl hover:bg-gray-200/70 transition">
        <div class="w-12 h-12 flex items-center justify-center mb-1">
          <svg class="w-10 h-10" viewBox="0 0 24 24">
            <path fill="#FF0000"
              d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8Z"/>
            <path fill="#fff" d="M9.5 15.5v-7l6 3.5z"/>
          </svg>
        </div>
        <span class="text-xs text-gray-700">YouTube</span>
      </a>

      <!-- Gemini -->
      <a href="#"
         class="flex flex-col items-center p-3 rounded-2xl hover:bg-gray-200/70 transition">
        <div class="w-12 h-12 flex items-center justify-center mb-1">
          <svg class="w-9 h-9" viewBox="0 0 24 24">
            <defs>
              <linearGradient id="gemini-gradient"
                              x1="0%" y1="0%"
                              x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4285F4"/>
                <stop offset="50%" stop-color="#9b72cb"/>
                <stop offset="100%" stop-color="#d96570"/>
              </linearGradient>
            </defs>
            <path fill="url(#gemini-gradient)"
              d="M12 0C12 6.627 17.373 12 24 12
                 C17.373 12 12 17.373 12 24
                 C12 17.373 6.627 12 0 12
                 C6.627 12 12 6.627 12 0Z"/>
          </svg>
        </div>
        <span class="text-xs text-gray-700">Gemini</span>
      </a>

      <!-- Maps -->
      <a href="#"
         class="flex flex-col items-center p-3 rounded-2xl hover:bg-gray-200/70 transition">
        <div class="w-12 h-12 flex items-center justify-center mb-1">
          <svg class="w-9 h-9" viewBox="0 0 24 24">
            <path fill="#EA4335"
              d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle fill="#4285F4" cx="12" cy="9" r="2.5"/>
          </svg>
        </div>
        <span class="text-xs text-gray-700">Maps</span>
      </a>

      <!-- Search -->
      <a href="#"
         class="flex flex-col items-center p-3 rounded-2xl hover:bg-gray-200/70 transition">
        <div class="w-12 h-12 flex items-center justify-center mb-1">
          <svg class="w-9 h-9" viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="6.5"
                    fill="none" stroke="#4285F4" stroke-width="2"/>
            <path d="M15.5 15.5L21 21"
                  stroke="#EA4335" stroke-width="2"
                  stroke-linecap="round"/>
          </svg>
        </div>
        <span class="text-xs text-gray-700">Search</span>
      </a>

      <!-- Calendar -->
      <a href="#"
         class="flex flex-col items-center p-3 rounded-2xl hover:bg-gray-200/70 transition">
        <div class="w-12 h-12 flex items-center justify-center mb-1">
          <svg class="w-9 h-9" viewBox="0 0 24 24">
            <rect x="4" y="5" width="16" height="16"
                  rx="2" fill="white" stroke="#4285F4" stroke-width="2"/>
            <path d="M4 9h16" stroke="#4285F4" stroke-width="2"/>
            <path d="M8 3v4M16 3v4"
                  stroke="#4285F4" stroke-width="2"
                  stroke-linecap="round"/>
            <text x="12" y="17"
                  text-anchor="middle"
                  font-size="7"
                  font-weight="bold"
                  fill="#4285F4">31</text>
          </svg>
        </div>
        <span class="text-xs text-gray-700">Calendar</span>
      </a>

      <!-- News -->
      <a href="#"
         class="flex flex-col items-center p-3 rounded-2xl hover:bg-gray-200/70 transition">
        <div class="w-12 h-12 flex items-center justify-center mb-1">
          <svg class="w-9 h-9" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16"
                  rx="2" fill="#4285F4"/>
            <rect x="6" y="7" width="5" height="4" fill="#fff"/>
            <path d="M13 8h5M13 11h5M6 14h12M6 17h8"
                  stroke="#fff" stroke-width="1.5"/>
          </svg>
        </div>
        <span class="text-xs text-gray-700">News</span>
      </a>

      <!-- Photos -->
      <a href="#"
         class="flex flex-col items-center p-3 rounded-2xl hover:bg-gray-200/70 transition">
        <div class="w-12 h-12 flex items-center justify-center mb-1">
          <svg class="w-9 h-9" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" fill="#4285F4"/>
            <circle cx="12" cy="12" r="5" fill="#34A853"/>
            <circle cx="12" cy="12" r="2" fill="#FBBC05"/>
          </svg>
        </div>
        <span class="text-xs text-gray-700">Photos</span>
      </a>

      <!-- Meet -->
      <a href="#"
         class="flex flex-col items-center p-3 rounded-2xl hover:bg-gray-200/70 transition">
        <div class="w-12 h-12 flex items-center justify-center mb-1">
          <svg class="w-9 h-9" viewBox="0 0 24 24">
            <rect x="3" y="6" width="13" height="12"
                  rx="3" fill="#34A853"/>
            <path fill="#4285F4" d="M16 10l5-3v10l-5-3z"/>
          </svg>
        </div>
        <span class="text-xs text-gray-700">Meet</span>
      </a>

      <!-- Translate -->
      <a href="#"
         class="flex flex-col items-center p-3 rounded-2xl hover:bg-gray-200/70 transition">
        <div class="w-12 h-12 flex items-center justify-center mb-1">
          <svg class="w-9 h-9" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M4 5h7v2H8.5c-.4 2-1.2 3.7-2.5 5
                 1.2 1.1 2.5 1.8 4 2.2l-.8 1.8
                 c-1.8-.5-3.4-1.4-4.7-2.7
                 C3.4 15.1 2 16 2 16v-2
                 c1.4-.8 2.5-1.8 3.3-3
                 C4.5 9.8 4 8.4 4 7H2V5h2z"/>
            <path fill="#34A853"
              d="M13 11h3l4 9h-2.2l-.9-2h-4.8l-.9 2H9.8zm.8 5h3l-1.5-3.6z"/>
          </svg>
        </div>
        <span class="text-xs text-gray-700">Translate</span>
      </a>
    </div>

    <div class="pt-4 px-2">
      <button
        type="button"
        class="w-full py-2.5 px-4 border border-gray-300 hover:bg-gray-200/80 rounded-full text-blue-600 font-medium text-sm transition">
        More from Google
      </button>
    </div>
  </div>
  </header>
  
  <main class="flex flex-col items-center mt-[6vh] px-4">
    <h1 class="text-[85px] md:text-[92px] font-medium tracking-tighter leading-none select-none mb-8">
      <span class="text-[#4285F4]">G</span><span class="text-[#EA4335]">o</span><span class="text-[#FBBC05]">o</span><span class="text-[#4285F4]">g</span><span class="text-[#34A853]">l</span><span class="text-[#EA4335]">e</span>
    </h1>

    <div class="w-full max-w-[580px] h-[52px] bg-white rounded-full shadow-[0_1px_6px_rgba(32,33,36,0.28)] border border-transparent hover:shadow-[0_2px_8px_rgba(32,33,36,0.28)] flex items-center px-4 gap-3">
      <button class="text-[#5f6368]">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <input type="text" placeholder="Ask Google" class="flex-1 outline-none text-[16px] placeholder:text-[#5f6368]/80 bg-transparent"/>

      <div class="flex items-center gap-3 ml-auto">
        <!-- Mic -->
        <button class="p-1.5 rounded-full hover:bg-gray-100">
          <svg class="w-5 h-5 fill-[#474747]" viewBox="0 0 24 24"><path d="M12 14a3.5 3.5 0 0 0 3.5-3.5V5a3.5 3.5 0 0 0-7 0v5.5A3.5 3.5 0 0 0 12 14zm4.5-3.5a4.5 4.5 0 0 1-9 0H5.5a6.5 6.5 0 0 0 6 6.5V21h1v-3.5a6.5 6.5 0 0 0 6-6.5h-2z"/></svg>
        </button>
        <!-- Lens -->
        <button class="p-1.5 rounded-full hover:bg-gray-100">
          <svg class="w-5 h-5 fill-[#474747]" viewBox="0 0 24 24"><path d="M4 4h7v2H6v5H4V4zm16 0v7h-2V6h-5V4h7zM4 20v-7h2v5h5v2H4zm15-2v-2h2v2h-2zm-2-2v-2h2v2h-2zm-2-2v-2h2v2h-2zM9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0zm3-5a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>
        </button>
        <!-- AI Mode -->
        <button class="flex items-center gap-1.5 pl-2 pr-3 py-1.5 rounded-full bg-[#f0f4f9] hover:bg-[#e1e8f0] text-[14px] text-[#1f1f1f] border border-transparent">
          <span class="w-[18px] h-[18px] rounded-full bg-gradient-to-tr from-red-400 via-yellow-400 to-blue-500 grid place-items-center">
            <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 11a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM19 13l-2-2M18 5l1-1"/><path d="M15 8l-1.5-1.5M10 18l-1 2 2-1 2 1-1-2"/></svg>
          </span>
          AI Mode
        </button>
      </div>
    </div>


    <div class="mt-6 flex flex-col gap-3 w-full max-w-[340px]">
      <button class="flex items-start gap-3 bg-[#f0f4f9] hover:bg-[#e8eef6] rounded-2xl px-4 py-3 text-left">
        <span class="mt-0.5"><svg class="w-5 h-5 text-[#474747]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M11 8v3l2 2M19 13l-1 1M20 8l-1-1M20 4l-1 1"/></svg></span>
        <span>
          <p class="text-[14px] font-medium leading-tight">Do more with AI Mode</p>
          <p class="text-[12px] text-[#5f6368]">Create, summarize, plan</p>
        </span>
      </button>

      <button class="flex items-start gap-3 bg-[#f0f4f9] hover:bg-[#e8eef6] rounded-2xl px-4 py-3 text-left">
        <span class="mt-0.5 text-[16px]">🍌</span>
        <span>
          <p class="text-[14px] font-medium leading-tight">Create images</p>
          <p class="text-[12px] text-[#5f6368]">Reimagine, illustrate, edit</p>
        </span>
      </button>
    </div>
  </main>


  <button class="fixed bottom-5 right-5 bg-[#d3e3fd] hover:bg-[#c2d8fb] text-[#001d35] text-[13px] font-medium px-4 py-2.5 rounded-full flex items-center gap-2 shadow">
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    Customize Chrome
  </button>

  <script>
  const btn = document.getElementById('apps-btn');
  const menu = document.getElementById('apps-menu');

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    menu.classList.toggle('hidden');
  });

  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target) && !btn.contains(e.target)) {
      menu.classList.add('hidden');
    }
  });
</script>

</body>
</html>
